<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>财税文案神器 - 景洪本地推硬广生成</title>
  <style>
    :root {
      --primary: #2B7AE8;
      --primary-light: #E8F2FF;
      --success: #52C41A;
      --danger: #FF4D4F;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #1F2937;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .header h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .service-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tag {
      padding: 8px 14px;
      background: var(--bg);
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .tag.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }

    .demand-box {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .demand-box:focus {
      border-color: var(--primary);
    }

    .voice-box {
      margin-top: 12px;
    }

    .voice-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .voice-btn:active, .voice-btn.recording {
      background: var(--primary);
      color: #fff;
    }

    .voice-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .voice-status {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      min-height: 20px;
    }

    .voice-tip {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--primary);
      min-height: 20px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:active {
      opacity: 0.9;
    }

    .btn-primary:disabled {
      background: #A0C4FF;
      cursor: not-allowed;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 12px;
      text-align: center;
    }

    .result {
      display: none;
    }

    .result.open {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
    }

    .result-tag {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .block {
      margin-bottom: 24px;
    }

    .block-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }

    .copy-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .copy-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .copy-btn {
      font-size: 13px;
      color: var(--primary);
      white-space: nowrap;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--primary);
    }

    .script-block {
      background: var(--bg);
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 1000;
      display: none;
      text-align: center;
      max-width: 80%;
    }

    .toast.show {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .recording-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      color: #fff;
    }

    .recording-overlay.show {
      display: flex;
    }

    .recording-circle {
      width: 80px;
      height: 80px;
      background: var(--danger);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .recording-time {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .recording-tip {
      font-size: 14px;
      opacity: 0.9;
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }

    .settings-panel {
      display: none;
      padding-top: 8px;
    }

    .settings-panel.open {
      display: block;
    }

    .settings-group {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border);
    }

    .settings-group-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .api-status {
      font-size: 13px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .api-status.success {
      display: block;
      background: #F6FFED;
      color: var(--success);
      border: 1px solid #B7EB8F;
    }

    .api-status.error {
      display: block;
      background: #FFF2F0;
      color: var(--danger);
      border: 1px solid #FFCCC7;
    }
  </style>
</head>

          <button class="btn-secondary" id="testApiBtn">测试 API 连接</button>
          <div id="apiStatus" class="api-status"></div>
        </div>

        <div class="settings-group">
          <div class="settings-group-title">飞书文档同步（可选）</div>
          <div class="form-group">
            <label>飞书 App ID</label>

    // ========== 语音输入（兼容手机/微信/Chrome/Safari） ==========
    let recognition = null;
    let recognizing = false;
    let finalTranscript = '';
    let interimTranscript = '';
    let recordTimer = null;
    let silenceTimer = null;
    let seconds = 0;
    let voiceStartTimer = null;
    let voiceStopTimer = null;
    let isTouchDevice = false;
    let isPointerDown = false;
    let hasVoiceSupport = false;

    function detectEnv() {
      const ua = navigator.userAgent.toLowerCase();
      const isWechat = /micromessenger/.test(ua);
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isAndroid = /android/.test(ua);
      const isMobile = isIOS || isAndroid;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      return { isWechat, isIOS, isAndroid, isMobile, SpeechRecognition };
    }

    function checkVoiceSupport() {
      const env = detectEnv();
      hasVoiceSupport = !!env.SpeechRecognition;

      if (!hasVoiceSupport) {
        voiceBtn.disabled = true;
        voiceBtnText.textContent = '当前浏览器不支持语音';
        voiceBtn.style.opacity = '0.6';
        voiceStatus.textContent = '请换 Chrome/Edge/ Safari 浏览器';
        voiceTip.textContent = env.isWechat
          ? '微信内置浏览器不支持语音识别，可点击右上角“在浏览器打开”用 Chrome/Safari。'
          : '当前浏览器不支持 Web Speech API，建议换 Chrome/Edge/Safari。';
        return;
      }

      if (env.isWechat) {
        voiceTip.textContent = '微信内可直接使用；若语音不稳定，点击右上角“在浏览器打开”体验更佳。';
      }

      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const isHttps = location.protocol === 'https:';
      if (!isHttps && !isLocalhost) {
        voiceStatus.textContent = '当前为非 HTTPS 页面，语音可能无法使用';
        voiceTip.textContent = '请部署到 HTTPS（如 GitHub Pages）后再试语音功能。';
      }
    }

    function bindVoiceEvents() {
      const env = detectEnv();
      isTouchDevice = env.isMobile;

      if (env.isMobile) {
        voiceBtn.addEventListener('touchstart', handleTouchStart, { passive: false });
        voiceBtn.addEventListener('touchend', handleTouchEnd, { passive: false });
        voiceBtn.addEventListener('touchcancel', handleTouchEnd, { passive: false });
        voiceBtn.addEventListener('touchmove', (e) => { if (recognizing) e.preventDefault(); }, { passive: false });
      } else {
        voiceBtn.addEventListener('pointerdown', handlePointerDown, { passive: false });
        voiceBtn.addEventListener('pointerup', handlePointerUp, { passive: false });
        voiceBtn.addEventListener('pointercancel', handlePointerUp, { passive: false });
        voiceBtn.addEventListener('pointerleave', handlePointerUp, { passive: false });
      }

      voiceBtn.addEventListener('contextmenu', (e) => e.preventDefault());
      voiceBtn.addEventListener('selectstart', (e) => e.preventDefault());
    }

    function handleTouchStart(e) {
      e.preventDefault();
      e.stopPropagation();
      isPointerDown = true;
      if (recognizing) {
        stopVoice();
      } else {
        startVoice();
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      e.stopPropagation();
      isPointerDown = false;
      if (recognizing) {
        voiceStopTimer = setTimeout(() => stopVoice(), 300);
      }
    }

    function handlePointerDown(e) {
      e.preventDefault();
      e.stopPropagation();
      isPointerDown = true;

      if (recognizing) {
        stopVoice();
        return;
      }

      startVoice();

      document.addEventListener('pointerup', handleGlobalPointerUp, { once: true });
      document.addEventListener('pointercancel', handleGlobalPointerUp, { once: true });
    }

    function handlePointerUp(e) {
      e.preventDefault();
      e.stopPropagation();
      isPointerDown = false;
      if (recognizing) {
        voiceStopTimer = setTimeout(() => stopVoice(), 300);
      }
    }

    function handleGlobalPointerUp(e) {
      isPointerDown = false;
      if (recognizing) {
        voiceStopTimer = setTimeout(() => stopVoice(), 300);
      }
    }

    function startVoice() {
      const env = detectEnv();
      const SpeechRecognition = env.SpeechRecognition;
      if (!SpeechRecognition) {
        showToast('当前浏览器不支持语音识别');
        return;
      }

      if (recognizing) return;

      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const isHttps = location.protocol === 'https:';
      if (!isHttps && !isLocalhost) {
        showToast('语音功能需要 HTTPS，请先部署到 GitHub Pages');
        voiceStatus.textContent = '语音需要 HTTPS 页面';
        return;
      }

      finalTranscript = '';
      interimTranscript = '';
      seconds = 0;
      clearTimeout(voiceStopTimer);

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = !env.isMobile;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      let hasStarted = false;

      recognition.onstart = () => {
        hasStarted = true;
        recognizing = true;
        voiceBtn.classList.add('recording');
        voiceBtnText.textContent = env.isMobile ? '松开结束' : '点击停止';
        voiceStatus.textContent = '正在听，请说话...';
        recordingOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        startRecordTimer();
        clearTimeout(voiceStartTimer);
        if (env.isMobile && navigator.vibrate) {
          navigator.vibrate(30);
        }
      };

      recognition.onresult = (event) => {
        interimTranscript = '';
        let hasFinal = false;

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript;
            hasFinal = true;
          } else {
            interimTranscript += transcript;
          }
        }

        updateInputText();

        if (hasFinal) {
          resetSilenceTimer();
        }
      };

      recognition.onerror = (event) => {
        console.error('语音识别错误:', event.error);
        clearTimeout(voiceStartTimer);
        if (event.error === 'not-allowed') {
          voiceStatus.textContent = '麦克风权限被拒绝';
          showToast('请允许麦克风权限，并确保使用 HTTPS 页面');
        } else if (event.error === 'network') {
          voiceStatus.textContent = '语音识别网络异常';
          showToast('网络异常，语音识别失败');
        } else if (event.error === 'no-speech') {
          voiceStatus.textContent = '没有检测到声音';
          showToast('没有检测到声音');
        } else if (event.error === 'audio-capture') {
          voiceStatus.textContent = '无法访问麦克风';
          showToast('无法访问麦克风');
        } else if (event.error !== 'aborted') {
          voiceStatus.textContent = '语音识别失败：' + event.error;
          showToast('语音识别失败，请重试');
        }
        safeResetVoiceUI();
      };

      recognition.onend = () => {
        if (finalTranscript || interimTranscript) {
          state.demand = state.demand + finalTranscript + interimTranscript;
          demandInput.value = state.demand;
        }
        safeResetVoiceUI();
      };

      voiceStatus.textContent = '正在启动语音...';
      try {
        recognition.start();
        voiceStartTimer = setTimeout(() => {
          if (!hasStarted) {
            voiceStatus.textContent = '语音启动超时，请重试';
            showToast('语音启动超时，建议换浏览器或检查权限');
            safeResetVoiceUI();
          }
        }, 4000);
      } catch (err) {
        showToast('语音启动失败：' + err.message);
        safeResetVoiceUI();
      }
    }

    function stopVoice() {
      clearTimeout(voiceStartTimer);
      clearTimeout(silenceTimer);
      clearTimeout(voiceStopTimer);
      try {
        if (recognition && recognizing) {
          recognition.stop();
        } else {
          safeResetVoiceUI();
        }
      } catch (err) {
        safeResetVoiceUI();
      }
    }

    function updateInputText() {
      demandInput.value = state.demand + finalTranscript + interimTranscript;
    }

    function resetSilenceTimer() {
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (recognizing) {
          stopVoice();
          showToast('检测到停顿，已自动结束');
        }
      }, 2500);
    }

    function startRecordTimer() {
      recordTimer = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        recordingTime.textContent = `${m}:${s}`;

        if (seconds >= 60) {
          stopVoice();
          showToast('单次录音最长60秒');
        }
      }, 1000);
    }

    function safeResetVoiceUI() {
      clearTimeout(voiceStartTimer);
      clearTimeout(silenceTimer);
      clearTimeout(voiceStopTimer);
      try {
        if (recognition && recognizing) {
          recognition.stop();
        }
      } catch (e) {}
      resetVoiceUI();
    }

    function resetVoiceUI() {
      recognizing = false;
      voiceBtn.classList.remove('recording');
      voiceBtnText.textContent = '按住说话';
      voiceStatus.textContent = '';
      recordingOverlay.classList.remove('show');
      document.body.style.overflow = '';
      clearInterval(recordTimer);
      clearTimeout(silenceTimer);
      clearTimeout(voiceStartTimer);
      clearTimeout(voiceStopTimer);
      seconds = 0;
      recordingTime.textContent = '00:00';
      recognition = null;
      isPointerDown = false;
    }

    // ========== 文案生成 ==========
    function buildSystemPrompt() {
      return `你是一个只服务财税公司的营销文案高手，专门产出适合“巨量本地推”的硬广文案。

## 风格要求
- 口语化，像景洪本地人聊天，可自然用“嘛”“呢”“噶”“了嘛”“整”“捋清楚”“吃亏”等语气词
- 说人话，把“税务异常”“汇算清缴”翻译成老百姓听得懂的大白话
- 有痛点，先戳老板的焦虑、麻烦、冤枉钱
- 给方案，再给出简单直接的服务价值
- 促行动，结尾必有明确的预约、咨询、到店、私信引导

## 爆款结构
1. 钩子开场（3秒抓人）
2. 痛点放大
3. 解决方案
4. 信任背书（本地、专业、响应快）
5. 限时福利/行动号召

## 输出格式
每次必须按 JSON 格式返回，不要包含其他说明：
{
  "titles": ["标题1", "标题2", "标题3"],
  "script": "完整口播脚本，含画面提示",
  "cover": "封面大字+小字文案",
  "comments": [
    {"question": "客户常见问题", "answer": "回复话术"}
  ],
  "cta": "行动号召话术"
}`;
    }

    function buildUserPrompt() {
      const serviceName = getServiceName(state.service);
      const serviceDesc = getServiceDesc(state.service);
      const demand = state.demand.trim();
      return `业务：${serviceName}（${serviceDesc}）\n${demand ? '额外要求：' + demand + '\n' : ''}请直接返回 JSON 格式文案。`;
    }

    // ========== 极速生成：本地模板，1 秒内出结果，不依赖 API ==========
    function generateFast() {
      setLoading(true, 'fast');
      setTimeout(() => {
        try {
          generateLocal('本地极速模板生成，无需等待，随时可用');
        } catch (err) {
          console.error('本地生成出错:', err);
          generateLocal('本地模板生成（已自动恢复）');
        } finally {
          setLoading(false, 'fast');
        }
      }, 80);
    }

    // ========== AI 智能生成：调用大模型，失败或超时时自动降级本地模板 ==========
    async function generateAI() {
      const apiKey = localStorage.getItem('caishui_apiKey');
      const baseURL = localStorage.getItem('caishui_baseURL');
      const model = localStorage.getItem('caishui_modelName');

      if (!apiKey) {
        showToast('未填写 API 密钥，先用本地极速模板生成');
        generateFast();
        return;
      }

      setLoading(true, 'ai');
      let apiSucceed = false;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      try {
        const response = await fetch(`${baseURL}/chat/completions`, {
          method: 'POST',
          signal: controller.signal,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: buildSystemPrompt() },
              { role: 'user', content: buildUserPrompt() },
            ],
            temperature: 0.8,
          }),
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          let errMsg = `请求失败：${response.status}`;
          try {
            const err = await response.json();
            errMsg = err.error?.message || err.message || errMsg;
          } catch (e) {}
          throw new Error(errMsg);
        }

        const data = await response.json();
        if (!data.choices || !data.choices[0] || !data.choices[0].message) {
          throw new Error('API 返回数据异常，请检查模型名称');
        }
        const content = data.choices[0].message.content;
        const result = parseResult(content);
        state.lastResult = result;
        renderResult(result, 'AI 智能生成');
        apiSucceed = true;
      } catch (err) {
        clearTimeout(timeoutId);
        console.error('API 生成失败，降级本地模板:', err);
      }

      if (!apiSucceed) {
        generateLocal('API 响应较慢或失败，已自动切换本地极速模板，保证 10 秒内出结果');
      }

      setLoading(false, 'ai');
    }

    function generateLocal(notice) {
      const tpl = getLocalTemplate(state.service);
      const serviceName = getServiceName(state.service);

      const result = {
        titles: tpl.titles,
        script: tpl.script,
        cover: tpl.cover,
        comments: tpl.comments,
        cta: tpl.cta,
      };

      // 如果用户有额外需求，尝试简单替换关键词
      const demand = state.demand.trim();
      if (demand) {
        result.titles = result.titles.map(t => t + (demand.includes('便宜') || demand.includes('价格') ? '，价格透明不吃亏' : ''));
      }

      state.lastResult = result;
      renderResult(result, '本地极速模板', notice || '本地极速模板生成');
    }

    function parseResult(content) {
      try {
        // 尝试提取 JSON 代码块
        const jsonMatch = content.match(/```json\s*([\s\S]*?)```/) || content.match(/```\s*([\s\S]*?)```/);
        const jsonStr = jsonMatch ? jsonMatch[1].trim() : content.trim();
        return JSON.parse(jsonStr);
      } catch (err) {
        console.error('解析 AI 返回失败:', err);
        // 返回一个兜底结果
        const tpl = getLocalTemplate(state.service);
        return {
          titles: tpl.titles,
          script: tpl.script,
          cover: tpl.cover,
          comments: tpl.comments,
          cta: tpl.cta,
        };
      }
    }

    function renderResult(result, tag, notice) {
      resultTag.textContent = tag;
      resultNotice.textContent = notice || '';

      titlesList.innerHTML = (result.titles || []).map((t, i) => `
        <div class="copy-item">
          <div class="copy-text">${i + 1}. ${t}</div>
          <button class="copy-btn" data-text="${escapeHtml(t)}">复制</button>
        </div>
      `).join('');

      scriptText.textContent = result.script || '';
      coverText.textContent = result.cover || '';
      ctaText.textContent = result.cta || '';

      commentsList.innerHTML = (result.comments || []).map(c => `
        <div class="copy-item">
          <div class="copy-text">
            <strong>问：${c.question}</strong><br>
            答：${c.answer}
          </div>
          <button class="copy-btn" data-text="${escapeHtml(c.question + '\n' + c.answer)}">复制</button>
        </div>
      `).join('');

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => copyText(btn.dataset.text));
      });

      resultCard.classList.add('open');
      setTimeout(() => {
        resultCard.scrollIntoView?.({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('已复制');
      } catch (err) {
        // 降级方案
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制');
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function setLoading(loading, mode) {
      state.generating = loading;
      generateBtn.disabled = loading;
      aiBtn.disabled = loading;
      if (loading) {
        generateBtn.innerHTML = mode === 'ai'
          ? '<span class="loading"></span>AI 正在写文案...'
          : '<span class="loading"></span>极速生成中...';
      } else {
        generateBtn.innerHTML = '立即生成文案（本地模板，1秒出稿）';
      }
    }

    // ========== API 测试 ==========
    async function testAPI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const baseURL = document.getElementById('baseURL').value.trim();
      const model = document.getElementById('modelName').value.trim();
      const statusEl = document.getElementById('apiStatus');

      if (!apiKey) {
        statusEl.textContent = '请先填写 API 密钥';
        statusEl.className = 'api-status error';
        return;
      }

      statusEl.textContent = '正在测试连接...';
      statusEl.className = 'api-status';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        const response = await fetch(`${baseURL}/chat/completions`, {
          method: 'POST',
          signal: controller.signal,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'user', content: '你好' }
            ],
            max_tokens: 5,
          }),
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          statusEl.textContent = '✅ API 连接成功';
          statusEl.className = 'api-status success';
        } else {
          const err = await response.json().catch(() => ({}));
          statusEl.textContent = `❌ 连接失败：${err.error?.message || response.statusText || response.status}`;
          statusEl.className = 'api-status error';
        }
      } catch (err) {
        statusEl.textContent = `❌ 连接失败：${err.message || '请检查网络或接口地址'}`;
        statusEl.className = 'api-status error';
      }
    }

    // ========== 飞书同步 ==========
    async function syncToFeishu() {
      if (!state.lastResult) {
        showToast('请先生成文案');
        return;
      }

      const appId = document.getElementById('feishuAppId').value.trim();
      const appSecret = document.getElementById('feishuAppSecret').value.trim();

      if (!appId || !appSecret) {
        showToast('请填写飞书 App ID 和 App Secret');
        return;
      }

      showToast('正在同步到飞书...');

      try {
        // 1. 获取 tenant_access_token
        const tokenRes = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ app_id: appId, app_secret: appSecret })
        });
        const tokenData = await tokenRes.json();
        if (tokenData.code !== 0) {
          throw new Error(tokenData.msg || '获取飞书 token 失败');
        }
        const token = tokenData.tenant_access_token;

        // 2. 创建文档
        const createRes = await fetch('https://open.feishu.cn/open-apis/docx/v1/documents', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            title: `财税文案 - ${getServiceName(state.service)} - ${new Date().toLocaleString()}`
          })
        });
        const createData = await createRes.json();
        if (createData.code !== 0) {
          throw new Error(createData.msg || '创建文档失败');
        }
        const docId = createData.data.document.document_id;

        // 3. 添加内容
        const result = state.lastResult;
        const blocks = [
          { block_type: 2, text: { elements: [{ text_run: { content: result.titles?.[0] || '财税文案' } }] } },
          { block_type: 3, text: { elements: [{ text_run: { content: result.script || '' } }] } },
        ];

        await fetch(`https://open.feishu.cn/open-apis/docx/v1/documents/${docId}/blocks/${docId}/children`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ children: blocks })
        });

        showToast('已同步到飞书文档');
      } catch (err) {
        console.error('飞书同步失败:', err);
        showToast('飞书同步失败：' + err.message);
      }
    }

    init();
  </script>
</body>
